name: Deploy Academics to InfinityFree

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality:
    name: Quality checks (PHP lint + tests)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: edusphere_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: edusphere_test
      DB_USER: root
      DB_PASS: root
      DB_NAME_TEST: edusphere_test
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, openssl, json, curl
          coverage: none
      - name: Wait for MySQL
        run: |
          until mysqladmin ping --host=127.0.0.1 --user=root --password=root --silent; do
            sleep 1
          done
      - name: Run migrations
        run: php database/migrate.php up
      - name: Verify upgrade from the legacy single-school schema
        env:
          MYSQL_PWD: root
        run: |
          mysql --host=127.0.0.1 --user=root -e "CREATE DATABASE edusphere_legacy_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mysql --host=127.0.0.1 --user=root edusphere_legacy_test < database/schema.sql
          APP_ENV=test DB_NAME_TEST=edusphere_legacy_test DB_NAME=edusphere_legacy_test DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root DB_PASS=root php database/migrate.php up
          legacy_school_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM edusphere_legacy_test.schools WHERE school_code='LEGACY001'")
          test "$legacy_school_count" -eq 1
          tenant_columns=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='edusphere_legacy_test' AND ((TABLE_NAME='users' AND COLUMN_NAME IN ('school_id','must_change_password')) OR (TABLE_NAME IN ('students','courses','enrollments','tasks','school_events','emergency_alerts','activity_logs','notifications') AND COLUMN_NAME='school_id'))")
          test "$tenant_columns" -ge 10
      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './storage/cache/*' -exec php -l {} \;
      - name: Run automated tests
        run: php tests/run_tests.php
      - name: Start PHP web server for portal smoke tests
        run: |
          php -S 127.0.0.1:8090 > /tmp/academics-php-server.log 2>&1 &
      - name: Wait for application
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/auth/login.php > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/academics-php-server.log
          exit 1
      - name: Verify role-based portal pages
        env:
          ACADEMICS_BASE: http://127.0.0.1:8090
        run: php storage/smoke_pages.php
      - name: Show PHP server diagnostics on failure
        if: failure()
        run: cat /tmp/academics-php-server.log

  web-deploy:
    name: 🚀 Auto Deploy to InfinityFree via FTP
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Sync files to InfinityFree htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            **/tests/**
            **/storage/*.php
            **/storage/cache/**
            **/storage/logs/**
            **/storage/tmp/**
            **/database.sql
            **/database/schema.sql
            **/database/seed.sql
            **/*.md
