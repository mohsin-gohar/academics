name: Deploy Academics to InfinityFree

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality:
    name: Quality checks (PHP lint + tests)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: edusphere_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: edusphere_test
      DB_USER: root
      DB_PASS: root
      DB_NAME_TEST: edusphere_test
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, openssl, json, curl
          coverage: none
      - name: Wait for MySQL
        run: |
          until mysqladmin ping --host=127.0.0.1 --user=root --password=root --silent; do
            sleep 1
          done
      - name: Run migrations
        run: php database/migrate.php up
      - name: Verify upgrade from the legacy single-school schema
        env:
          MYSQL_PWD: root
        run: |
          mysql --host=127.0.0.1 --user=root < database/schema.sql
          mysql --host=127.0.0.1 --user=root edusphere <<'SQL'
          INSERT INTO users (full_name,email,password,role,is_active) VALUES
            ('Legacy Teacher','legacy.teacher@example.test','legacy-hash','teacher',1),
            ('Legacy Student','legacy.student@example.test','legacy-hash','student',1);
          INSERT INTO students (user_id,student_number,full_name,email,enrollment_date,status)
            SELECT id,'LEGACY-STU-001',full_name,email,CURDATE(),'Active'
            FROM users WHERE email='legacy.student@example.test';
          INSERT INTO courses (course_code,course_name,created_by,instructor_id,status)
            SELECT 'LEGACY-101','Legacy Course',t.id,t.id,'Active'
            FROM users t WHERE t.email='legacy.teacher@example.test';
          INSERT INTO enrollments (student_id,course_id,enrollment_date,status)
            SELECT s.id,c.id,CURDATE(),'Enrolled'
            FROM students s JOIN users su ON su.id=s.user_id
            JOIN courses c ON c.course_code='LEGACY-101'
            WHERE su.email='legacy.student@example.test';
          INSERT INTO tasks (user_id,student_id,course_id,title,status)
            SELECT t.id,s.id,c.id,'Legacy Task','Pending'
            FROM users t JOIN students s JOIN courses c
            WHERE t.email='legacy.teacher@example.test'
              AND s.email='legacy.student@example.test' AND c.course_code='LEGACY-101';
          INSERT INTO school_events (title,event_type,event_date,created_by)
            SELECT 'Legacy Event','Meeting',CURDATE(),id FROM users WHERE email='legacy.teacher@example.test';
          INSERT INTO emergency_alerts (title,message,effective_date,updated_by)
            SELECT 'Legacy Alert','Legacy alert fixture',CURDATE(),id FROM users WHERE email='legacy.teacher@example.test';
          INSERT INTO activity_logs (user_id,action,entity_type,description)
            SELECT id,'legacy_fixture','migration','Legacy upgrade fixture' FROM users WHERE email='legacy.teacher@example.test';
          INSERT INTO leave_requests (user_id,leave_type,start_date,end_date,reason,status)
            SELECT id,'Medical',CURDATE(),CURDATE(),'Legacy leave migration fixture','Pending'
            FROM users WHERE email='legacy.teacher@example.test';
          SQL
          APP_ENV=test DB_NAME_TEST=edusphere DB_NAME=edusphere DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root DB_PASS=root php database/migrate.php up
          legacy_school_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM edusphere.schools WHERE school_code='LEGACY001'")
          test "$legacy_school_count" -eq 1
          legacy_subscription_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM edusphere.school_subscriptions ss JOIN edusphere.schools s ON s.id=ss.school_id WHERE s.school_code='LEGACY001' AND ss.transaction_id='MIGRATED-LEGACY001' AND ss.status='active'")
          test "$legacy_subscription_count" -eq 1
          legacy_subscription_days=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT DATEDIFF(ss.end_date, ss.start_date) FROM edusphere.school_subscriptions ss JOIN edusphere.schools s ON s.id=ss.school_id WHERE s.school_code='LEGACY001' AND ss.transaction_id='MIGRATED-LEGACY001'")
          test "$legacy_subscription_days" -ge 360
          test "$legacy_subscription_days" -le 370
          APP_ENV=test DB_NAME_TEST=edusphere DB_NAME=edusphere DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root DB_PASS=root php database/migrate.php up >/tmp/academics-migrate-repeat.log
          legacy_subscription_count_after_repeat=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM edusphere.school_subscriptions ss JOIN edusphere.schools s ON s.id=ss.school_id WHERE s.school_code='LEGACY001' AND ss.transaction_id='MIGRATED-LEGACY001'")
          test "$legacy_subscription_count_after_repeat" -eq 1
          tenant_columns=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='edusphere' AND ((TABLE_NAME='users' AND COLUMN_NAME IN ('school_id','must_change_password')) OR (TABLE_NAME IN ('students','courses','enrollments','tasks','school_events','emergency_alerts','activity_logs','notifications') AND COLUMN_NAME='school_id'))")
          test "$tenant_columns" -ge 10
          migrated_rows=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT (SELECT COUNT(*) FROM edusphere.users u JOIN edusphere.schools s ON s.id=u.school_id WHERE u.email='legacy.teacher@example.test') + (SELECT COUNT(*) FROM edusphere.students st JOIN edusphere.schools s ON s.id=st.school_id WHERE st.email='legacy.student@example.test') + (SELECT COUNT(*) FROM edusphere.courses c JOIN edusphere.schools s ON s.id=c.school_id WHERE c.course_code='LEGACY-101') + (SELECT COUNT(*) FROM edusphere.tasks t JOIN edusphere.schools s ON s.id=t.school_id WHERE t.title='Legacy Task') + (SELECT COUNT(*) FROM edusphere.enrollments e JOIN edusphere.schools s ON s.id=e.school_id)")
          test "$migrated_rows" -ge 5
          legacy_leave_rows=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM edusphere.leave_requests l JOIN edusphere.users u ON u.id=l.user_id WHERE u.email='legacy.teacher@example.test' AND l.leave_type='Medical' AND l.school_id IS NOT NULL")
          test "$legacy_leave_rows" -eq 1
          leave_schema_checks=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='edusphere' AND TABLE_NAME='leave_requests' AND COLUMN_NAME='approved_at') + (SELECT IF(COLUMN_TYPE LIKE '%Sick%' AND COLUMN_TYPE LIKE '%Paternity%',1,0) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='edusphere' AND TABLE_NAME='leave_requests' AND COLUMN_NAME='leave_type') + (SELECT IF(COLUMN_TYPE LIKE '%Cancelled%',1,0) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='edusphere' AND TABLE_NAME='leave_requests' AND COLUMN_NAME='status')")
          test "$leave_schema_checks" -eq 3
      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './storage/cache/*' -exec php -l {} \;
      - name: Run automated tests
        run: php tests/run_tests.php
      - name: Start PHP web server for portal smoke tests
        run: |
          php -S 127.0.0.1:8090 > /tmp/academics-php-server.log 2>&1 &
      - name: Wait for application
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/auth/login.php > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/academics-php-server.log
          exit 1
      - name: Verify role-based portal pages
        env:
          ACADEMICS_BASE: http://127.0.0.1:8090
        run: php storage/smoke_pages.php
      - name: Show PHP server diagnostics on failure
        if: failure()
        run: cat /tmp/academics-php-server.log

  web-deploy:
    name: 🚀 Auto Deploy to InfinityFree via FTP
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Sync files to InfinityFree htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            **/tests/**
            **/storage/*.php
            **/storage/cache/**
            **/storage/logs/**
            **/storage/tmp/**
            **/database.sql
            **/database/schema.sql
            **/database/seed.sql
            **/*.md
